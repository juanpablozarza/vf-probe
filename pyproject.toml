[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "vf-probe"
version = "0.1.0"
description = "Probe verifiers environments for graders that reward the wrong thing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "juanpablozarza" }]
dependencies = [
    "verifiers==0.4.1",
]

[project.scripts]
vf-probe = "vf_probe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vf_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
